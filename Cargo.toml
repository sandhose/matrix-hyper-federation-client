[package]
name = "matrix-hyper-federation-client"
version = "0.1.0"
edition = "2018"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bytes = "1.11.0"
doc-comment = "0.3.4"
ed25519-dalek = "2.2.0"
futures = "0.3.31"
futures-util = "0.3.31"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "server"] }
hyper-rustls = "0.27.7"
hyper-util = { version = "0.1.19", features = [
  "client",
  "client-legacy",
  "server",
  "service",
  "tokio",
] }
log = "0.4.29"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signed-json = { git = "https://github.com/erikjohnston/rust-signed-json.git" }
tokio = { version = "1.48.0", features = ["macros"] }
tokio-rustls = "0.26.4"
tower-service = "0.3.3"
hickory-resolver = "0.25.2"
url = "2.5.7"
